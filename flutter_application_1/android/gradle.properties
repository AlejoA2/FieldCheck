# 4G: la máquina de desarrollo tiene 16 GB y el daemon de Kotlin levanta su
# propia JVM. Con 8G para Gradle, la compilación de los plugins de Firebase
# (muchos módulos Kotlin en paralelo) se queda sin memoria y el daemon muere a
# mitad, dejando los caches incrementales a medias.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# La compilación Kotlin corre dentro de la JVM de Gradle en lugar de en un
# daemon aparte: un proceso menos que puede morir y corromper los caches
# incrementales ("Could not close incremental caches") en Windows.
kotlin.compiler.execution.strategy=in-process

# Los caches incrementales de Kotlin se vuelven a escribir en cada build. Es el
# ajuste que elimina ese error en Windows cuando un antivirus o el sistema
# bloquea los archivos .tab mientras están abiertos; el coste es recompilar los
# módulos de plugins, que es pequeño frente a lo que cuesta diagnosticar el fallo.
kotlin.incremental=false

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
